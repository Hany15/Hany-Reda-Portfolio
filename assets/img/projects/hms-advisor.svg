t x="306" y="158" font-size="10.5" fill="#6b7c8d">Embedded rule-based engine · works fully offline</text><rect x="610" y="190" width="622" height="42" rx="12" fill="#1f7ac0"/><text x="628" y="216" font-size="11.5" fill="#ffffff">Which products need reordering this week?</text><rect x="268" y="250" width="622" height="96" rx="12" fill="#f2f5f8"/><text x="286" y="276" font-size="11.5" fill="#1c2b3a">3 products are projected to stock out within 7 days: Infusion</text><text x="286" y="294" font-size="11.5" fill="#1c2b3a">Pump (3 on hand, avg. 1.4/day demand), Defibrillator (0 on</text><text x="286" y="312" font-size="11.5" fill="#1c2b3a">hand), and Surgical Light (6 on hand, avg. 0.9/day). Suggested</text><text x="286" y="330" font-size="11.5" fill="#1c2b3a">reorder quantities are shown on the Reports page.</text><rect x="610" y="364" width="622" height="42" rx="12" fill="#1f7ac0"/><text x="628" y="390" font-size="11.5" fill="#ffffff">What is our current Zakat estimate?</text><rect x="268" y="424" width="622" height="96" rx="12" fill="#f2f5f8"/><text x="286" y="450" font-size="11.5" fill="#1c2b3a">Based on your current chart of accounts: total assets SAR</text><text x="286" y="468" font-size="11.5" fill="#1c2b3a">320,000, total liabilities SAR 71,500, base SAR 248,500.</text><text x="286" y="486" font-size="11.5" fill="#1c2b3a">Estimated Zakat at your configured rate is SAR 4,120. This is</text><text x="286" y="504" font-size="11.5" fill="#1c2b3a">a simplified internal estimate, not an official ZATCA return.</text><rect x="268" y="728" width="964" height="34" rx="17" fill="#f2f5f8"/><text x="288" y="750" font-size="11" fill="#6b7c8d">Ask the Smart Advisor about stock, sales, or receivables…</text></svg>